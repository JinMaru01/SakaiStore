# Sakai Store on one server (VPS) — or just the database for local development.
#
#   Local dev DB only:   docker compose up -d db          (then npm run db:setup && npm run dev)
#   Full stack:          cp .env.example .env  # fill in secrets
#                        docker compose up -d --build
#
# Services:
#   db       Postgres 16 with a persistent volume, published on 127.0.0.1 only
#   migrate  one-off: applies migrations, seeds the sample catalog on an EMPTY database
#   app      the website (Next.js standalone), waits for migrate to finish
#   cron     calls /api/cron/reconcile every minute (late / unpolled KHQR payments)
#
# Put a TLS reverse proxy (Caddy, nginx, Cloudflare Tunnel) in front of
# port 3000 — see docs/DEPLOYMENT.md.

x-db-url: &db-url postgresql://${POSTGRES_USER:-sakai}:${POSTGRES_PASSWORD:-sakai}@db:5432/${POSTGRES_DB:-sakaistore}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sakai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sakai}
      POSTGRES_DB: ${POSTGRES_DB:-sakaistore}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Localhost only: reachable by `npm run dev` on this machine, never from the internet.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: tools
    env_file:
      - path: .env
        required: false # `docker compose up -d db` works before .env exists
    environment:
      DATABASE_URL: *db-url
      DATABASE_SSL: "false"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_FB_PIXEL_ID: ${NEXT_PUBLIC_FB_PIXEL_ID:-}
        NEXT_PUBLIC_TIKTOK_PIXEL_ID: ${NEXT_PUBLIC_TIKTOK_PIXEL_ID:-}
    image: sakaistore:latest
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: *db-url
      DATABASE_SSL: "false"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped

  cron:
    image: postgres:16-alpine # any small image with busybox wget; reuses the db image
    env_file:
      - path: .env
        required: false
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          wget -q -O - --header "Authorization: Bearer $${CRON_SECRET}" http://app:3000/api/cron/reconcile || true
          echo
          sleep 60
        done
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
